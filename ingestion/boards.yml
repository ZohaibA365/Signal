# Hand-resolved career boards.
#
# These are the entries that automation cannot produce. Slug-guessing against
# the startup boards resolved 27 of the 120 largest employers; the rest are on
# systems whose coordinates are arbitrary strings that must be read off a real
# careers URL:
#
#   Capital One  ->  capitalone.wd12 / Capital_One    (not wd1, not "Careers")
#   Bosch        ->  BoschGroup                       (not "bosch")
#
# Every entry here is verified against the live board by
# `board_discovery.py --load-manual` before it is stored, so a wrong tenant or
# site path fails loudly instead of silently attaching an empty board to a
# company.
#
# `company` keys must match company_name in raw_postings exactly, or the
# resolved board will not join to the postings it is meant to replace.

companies:

  Capital One:
    ats: workday
    tenant: capitalone
    host: wd12
    site: Capital_One
    note: 1,852 postings incl. ~1,100 internships; 871 broken Adzuna rows replaced

  PwC:
    ats: workday
    tenant: pwc
    host: wd3
    site: US_Experienced_Careers

  Booz Allen Hamilton:
    ats: workday
    tenant: bah
    host: wd1
    site: BAH_Jobs

  General Motors:
    ats: workday
    tenant: generalmotors
    host: wd5
    site: Careers_GM

  Bosch:
    ats: smartrecruiters
    slug: BoschGroup
    note: slug is case-sensitive and not derivable from the company name

  Amazon:
    ats: amazon
    note: >
      No third-party board, so without a bespoke adapter Amazon's postings can
      only come from an aggregator - an unclickable link. Hires interns at a
      scale that earns the exception.

  Highmark Health:
    ats: workday
    tenant: highmarkhealth
    host: wd1
    site: highmark

  GE Aerospace:
    ats: workday
    tenant: geaerospace
    host: wd5
    site: GE_ExternalSite

  Medtronic:
    ats: workday
    tenant: medtronic
    host: wd1
    site: MedtronicCareers

  Humana:
    ats: workday
    tenant: humana
    host: wd5
    site: Humana_External_Career_Site

  Oracle:
    ats: oraclecloud
    host: eeho.fa.us2.oraclecloud.com
    site: CX_1
    note: >
      Oracle Cloud Recruiting. The pod host is opaque and no more guessable
      than a Workday tenant, so it is read off the real careers URL.

  RBC:
    ats: workday
    tenant: rbc
    host: wd3
    site: RBCEARLYTALENT1
    note: >
      RBC runs a separate early-talent board. 114 postings, almost all Winter
      2027 co-op terms in Toronto - the single densest source of Ontario
      student roles found so far. Their general board is a different site.

  TD Bank:
    ats: workday
    tenant: td
    host: wd3
    site: TD_Bank_Careers

  BMO:
    ats: workday
    tenant: bmo
    host: wd3
    site: External
    note: their Campus board holds 33; External is the superset at 914

  CIBC:
    ats: workday
    tenant: cibc
    host: wd3
    site: Campus

  Sun Life:
    ats: workday
    tenant: sunlife
    host: wd3
    site: Campus

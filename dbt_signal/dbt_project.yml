name: signal
version: 1.0.0
config-version: 2

profile: signal

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  signal:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      # Marts are physical tables: the dashboard queries them directly and
      # should not pay to recompute the whole chain on every page load.
      +materialized: table

signal:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'signal') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'signal') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'signal') }}"
      schema: public
      threads: 4
    # Hosted Neon warehouse behind the public dashboard. Uses the direct
    # (non-pooler) endpoint: dbt creates and drops tables, and PgBouncer in
    # transaction mode does not pass through everything DDL needs.
    prod:
      type: postgres
      host: "ep-wispy-dew-ay07k67r.c-5.us-east-2.aws.neon.tech"
      port: 5432
      # No defaults here on purpose: profiles.yml is committed, so a default
      # would put the password in git history. These must come from .env.
      user: "{{ env_var('NEON_USER') }}"
      password: "{{ env_var('NEON_PASSWORD') }}"
      dbname: "neondb"
      schema: public
      sslmode: require
      threads: 4

    # Snowflake as an ADDITIONAL target, not a replacement. Neon stays the
    # live warehouse behind the dashboard; this builds the same models into
    # Snowflake so the project is not welded to one engine.
    #
    # Needs SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER and SNOWFLAKE_PASSWORD in .env.
    # Build with:  dbt build --target snowflake
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'SIGNAL_DB') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'PUBLIC') }}"
      threads: 8
      client_session_keep_alive: false

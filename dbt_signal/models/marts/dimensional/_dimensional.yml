version: 2

models:
  - name: dim_company
    description: One row per company. Stops company attributes repeating on every posting.
    columns:
      - name: company_key
        tests: [not_null, unique]
      - name: company_name
        tests: [not_null, unique]
      - name: total_postings
        tests:
          - dbt_utils.accepted_range: {min_value: 1, inclusive: true}

  - name: dim_technology
    description: Conformed technology dimension, from the seeded vocabulary.
    columns:
      - name: technology_key
        tests: [not_null, unique]
      - name: tech_slug
        tests: [not_null, unique]
      - name: category
        tests: [not_null]

  - name: dim_date
    description: Date spine covering every date the warehouse references.
    columns:
      - name: date_key
        tests: [not_null, unique]
      - name: date_day
        tests: [not_null, unique]

  - name: fct_job_posting
    description: One row per posting, with keys to company and date.
    columns:
      - name: posting_key
        tests: [not_null, unique]
      - name: company_key
        tests:
          - not_null
          - relationships: {to: ref('dim_company'), field: company_key}
      - name: fit_score
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 100, inclusive: true}
      - name: posting_count
        tests:
          - dbt_utils.accepted_range: {min_value: 1, max_value: 1, inclusive: true}

  - name: fct_market_snapshot
    description: One row per technology per snapshot date - the compounding series.
    columns:
      - name: snapshot_key
        tests: [not_null, unique]
      - name: technology_key
        tests:
          - not_null
          - relationships: {to: ref('dim_technology'), field: technology_key}
      - name: openings
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, inclusive: true}

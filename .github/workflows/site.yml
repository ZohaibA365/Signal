name: Build and deploy site

# Regenerates the public site from the warehouse and publishes it to GitHub
# Pages. Runs daily so the index reflects the latest snapshot, and on every
# push to main so a change to a template or query ships immediately.
#
# Required secret: DATABASE_URL (the Neon connection string).
on:
  schedule:
    - cron: "30 7 * * *"        # after the 07:00 pipeline run
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_URL: ${{ vars.SITE_URL || 'https://zohaiba365.github.io/Signal' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # requirements-dev is what the CI workflow installs and is proven to
      # work on this runner; requirements.txt is the slimmer app-only file.
      # Using the proven one removes a variable.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The build is split into narrowly named steps on purpose. Step logs
      # require admin rights to download, but step NAMES and outcomes are
      # public - so if this fails, the name of the failing step identifies the
      # cause without anyone having to read a log.
      - name: Check imports resolve
        run: |
          python -c "import jinja2, psycopg2, sys; print(sys.version); print(jinja2.__version__)"

      - name: Check project modules import
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'storage'); sys.path.insert(0, 'site')
          import db, queries
          print('project modules OK')
          "

      - name: Check credential is present
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty."
            exit 1
          fi
          echo "DATABASE_URL present: ${#DATABASE_URL} chars"

      - name: Check warehouse reachable
        timeout-minutes: 10
        run: |
          python -c "
          import sys; sys.path.insert(0, 'storage')
          from db import connect, describe
          c = connect(autocommit=True)
          cur = c.cursor(); cur.execute('select count(*) from raw_postings')
          print('warehouse OK via', describe(), '-', cur.fetchone()[0], 'rows')
          "

      - name: Build site
        timeout-minutes: 15
        run: |
          set -o pipefail
          python -u site/build.py 2>&1 | tee /tmp/build.log

      - name: Sanity check output
        run: |
          pages=$(find site/dist -name index.html | wc -l)
          echo "generated $pages pages"
          if [ "$pages" -lt 100 ]; then
            echo "::error::only $pages pages generated - refusing to deploy"
            exit 1
          fi
          test -s site/dist/data/jobs.json || { echo "::error::search payload missing"; exit 1; }

      - name: Report failure to run summary
        if: failure()
        run: |
          {
            echo "## Site build failed"
            echo '```'
            tail -40 /tmp/build.log 2>/dev/null || echo "(build produced no output)"
            echo '```'
            echo "| check | value |"
            echo "| --- | --- |"
            echo "| python | $(python --version 2>&1) |"
            echo "| DATABASE_URL length | ${#DATABASE_URL} |"
            echo "| site/ contents | $(ls site 2>&1 | tr '\n' ' ') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

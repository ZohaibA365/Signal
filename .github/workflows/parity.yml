name: Engine parity

# Does Snowflake still agree with Postgres?
#
# The portability claim is only true while something checks it. Building on two
# engines is not the check - the bug this exists for compiled cleanly on both and
# returned different numbers: refuses_sponsorship found 3,172 postings on Postgres
# and zero on Snowflake, and nothing failed anywhere. Three of the four
# divergences found when this was first run were silent in exactly that way.
#
# Weekly, plus any push that changes the SQL. These are slow-moving properties of
# the SQL rather than of the data, and each run wakes a warehouse - which is the
# only expensive mistake available on Snowflake. Measured: a full run costs about
# 0.2 credits, the warehouse is X-Small and suspends after 60 seconds idle, and
# the account monitor caps the month at 5 credits. So roughly twenty runs a month
# fit, which a weekly cron plus occasional model changes does not approach. If the
# cap is ever reached the warehouse suspends and this workflow fails loudly, which
# is the right failure: nothing in the serving path depends on it.
#
# Nothing in the serving path depends on this. It is allowed to fail without
# consequence, and a failure means the two engines disagree, which is information
# rather than an outage.

on:
  # On a push that changes the SQL or the mirror, because those are the only
  # changes that can break engine parity - and waiting a week to find out, or for
  # somebody to remember to click, is how a divergence reached the published site
  # twice. Paths are narrow on purpose: every run wakes a warehouse, which is the
  # only expensive mistake available on Snowflake.
  push:
    branches: [main]
    paths:
      - "dbt_signal/**"
      - "storage/load_to_snowflake.py"
      - "storage/parity_check.py"
      - "storage/sponsorship_text.py"
      - "storage/schema.sql"
      - ".github/workflows/parity.yml"
  schedule:
    - cron: "0 6 * * 1"          # Mondays, free-tier cron runs hours late anyway
  workflow_dispatch:

# Shares the daily pipeline's group rather than having its own. Both run dbt
# against the same Postgres schema, and two builds dropping and recreating the
# same tables at once is a failure with no useful error attached to it.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_DATABASE: SIGNAL_DB
      SNOWFLAKE_SCHEMA: PUBLIC
      SNOWFLAKE_WAREHOUSE: COMPUTE_WH
      # SIGNAL_LOADER, not ACCOUNTADMIN. A CI credential is the one most likely to
      # leak, and ACCOUNTADMIN can drop the account's billing configuration.
      SNOWFLAKE_ROLE: SIGNAL_LOADER
      SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/.snowflake_key.p8
      DO_NOT_TRACK: "1"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-snowflake.txt

      # Key-pair auth, because the account enforces MFA and a password-presenting
      # driver is rejected outright. The key is a secret rather than a file in the
      # repo, and is written with restrictive permissions for the job's lifetime.
      # A PEM is a multi-line value being pasted into a one-line form, so the
      # line breaks are the part that goes missing - and that is exactly how the
      # first run of this workflow failed: secret present, key unparseable,
      # nothing downstream reached. scripts/snowflake_key.py rebuilds the PEM
      # from whichever shape survived, and refuses anything that is not a
      # private key rather than writing a file that fails later inside a driver.
      #
      # The secret goes through the environment, not through the command line:
      # an expression interpolated into a run: block is substituted before bash
      # sees it, which puts the key in the script itself.
      - name: Write the Snowflake key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: python scripts/snowflake_key.py "$SNOWFLAKE_PRIVATE_KEY_PATH"

      # dbt needs the warehouse credentials the same way the daily pipeline does,
      # from the one secret rather than three that can drift apart.
      - name: Derive warehouse credentials for dbt
        run: bash scripts/derive_dbt_credentials.sh

      # A row loaded before the sponsorship verdicts existed has NULL in both
      # columns, and stg_jobs reads them straight through, so such a row looks as
      # though its text never mentioned sponsorship. The loader evaluates them as
      # it goes; this makes sure the comparison never runs against a table that is
      # only half evaluated, which is a difference about loading order rather than
      # about SQL.
      - name: Evaluate any missing sponsorship verdicts
        timeout-minutes: 10
        run: python storage/load_to_warehouse.py --backfill-verdicts-only

      # Both engines must run the SAME model code, and that is what went wrong on
      # the first run that got this far. It compared a Snowflake build made
      # minutes earlier against a Postgres view the daily pipeline had built nine
      # hours before, from the previous commit. Two checks differed, and the
      # disagreement was real - the two engines were running different SQL.
      #
      # So Postgres is rebuilt from this checkout first. It is the same build the
      # daily pipeline runs, against the same warehouse, so it costs nothing and
      # risks nothing the daily run does not already.
      - name: Rebuild the models on Postgres
        id: pg_build
        working-directory: dbt_signal
        timeout-minutes: 25
        run: |
          set -o pipefail
          dbt deps --profiles-dir . --no-version-check
          if ! dbt build --profiles-dir . --no-version-check --target prod \
               2>&1 | tee /tmp/pg.log; then
            {
              echo "### Postgres build failed"
              echo '```'
              tail -40 /tmp/pg.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Postgres build failed::see the run summary"
            exit 1
          fi

      - name: Mirror the source tables to Snowflake
        id: mirror
        timeout-minutes: 20
        run: >-
          bash scripts/run_step.sh "Mirror to Snowflake"
          python storage/load_to_snowflake.py

      - name: Build every model on Snowflake
        id: build
        working-directory: dbt_signal
        timeout-minutes: 25
        run: |
          set -o pipefail
          dbt deps --profiles-dir . --no-version-check
          if ! dbt build --profiles-dir . --no-version-check --target snowflake \
               2>&1 | tee /tmp/sf.log; then
            {
              echo "### Snowflake build failed"
              echo '```'
              tail -40 /tmp/sf.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            DETAIL=$(grep -iE "error|syntax|unexpected|does not exist" /tmp/sf.log \
                     | head -10 | sed 's/"/\x27/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Snowflake build failed::${DETAIL:-see summary}"
            exit 1
          fi

      # The actual deliverable. A difference here means identical SQL produced
      # different answers, which is the failure mode that does not announce itself.
      - name: Compare the engines
        id: parity
        timeout-minutes: 10
        run: |
          set -o pipefail
          python storage/parity_check.py 2>&1 | tee /tmp/parity.log
          {
            echo "## Engine parity"
            echo '```'
            grep -E "postgres|ok$|DIFFERS|agree" /tmp/parity.log | sed 's/^[0-9: ,-]*INFO *//'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$SNOWFLAKE_PRIVATE_KEY_PATH"

name: Daily pipeline

# Collects the day's postings and refreshes the warehouse. This is what keeps
# the site's numbers moving: the publish workflow only re-renders whatever the
# warehouse already holds, so without this the site republishes identical
# figures forever - live-looking and static.
#
# Steps are deliberately narrow and individually named. Step logs need admin
# rights to download even on a public repo, but step NAMES and outcomes are
# public, so a failure identifies itself without anyone reading a log. That is
# what diagnosed the site build after several blind attempts.
#
# Required secrets:
#   DATABASE_URL, ADZUNA_APP_ID, ADZUNA_API_KEY,
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET, ANTHROPIC_API_KEY
on:
  schedule:
    - cron: "0 7 * * *"          # 07:00 UTC, before the 07:30 site build
  workflow_dispatch:
    inputs:
      skip_enrichment:
        description: "Skip LLM scoring (saves cost)"
        type: boolean
        default: false

concurrency:
  group: daily-pipeline          # runs share warehouse tables
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # The whole run, not a step. Measured on 7 September: steps 1-12 take
    # 36 minutes, and the transform alone takes about 36 more now the corpus
    # is 81,000 postings - which totals more than the 90 this used to allow.
    # The old limit was set when the corpus was a quarter of the size.
    timeout-minutes: 150
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Which candidate profile roles are scored against. profile.py defaults
      # to "cobol", so leaving this unset meant every daily score was computed
      # for a mainframe programmer seeking $80k+ rather than a student looking
      # for a Winter 2027 internship - a silently wrong answer, not an error.
      SIGNAL_PROFILE: student
      DO_NOT_TRACK: "1"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Names every missing secret at once rather than failing on the first,
      # so one run tells you everything to add instead of six.
      - name: Check secrets are present
        run: |
          missing=""
          for v in DATABASE_URL ADZUNA_APP_ID ADZUNA_API_KEY \
                   AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY S3_BUCKET; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "Missing:$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "all required secrets present"

      - name: Check warehouse reachable
        timeout-minutes: 10
        run: |
          python -c "
          import sys; sys.path.insert(0, 'storage')
          from db import connect, describe
          c = connect(autocommit=True); cur = c.cursor()
          cur.execute('select count(*) from raw_postings')
          print('warehouse OK via', describe(), '-', cur.fetchone()[0], 'rows')
          "

      # The compounding asset, and the only step that cannot be backfilled:
      # the source API reports today's demand and nothing else, so a missed
      # run is a permanent hole in the series. It runs first for that reason.
      - name: Market snapshot
        timeout-minutes: 20
        run: python ingestion/market_snapshot.py

      - name: Ingest postings from aggregator
        timeout-minutes: 30
        run: python ingestion/adzuna_ingest.py --pages 5 --country us ca --resume

      # The job list is built from career boards, not the aggregator: an
      # Adzuna link is country-gated and cannot be clicked from outside the
      # posting's own country. Without this step the site would keep
      # republishing the same board postings while only the market statistics
      # moved.
      - name: Ingest postings from career boards
        timeout-minutes: 45
        # Bounded by wall-clock time, not board count.
        #
        # Capping at 400 boards was the obvious fix and it still timed out,
        # because a board count is not a bound on work: Bosch carries 4,803
        # postings and TD Bank 1,659, and the systems charging a request per
        # posting spend minutes on one company. 30 minutes leaves margin
        # inside the 45 this step allows, and stalest-first ordering means
        # every board still comes round.
        # Two budgets, because one is not enough. --max-seconds stops new
        # boards after 25 minutes; --board-seconds stops any single board
        # spending more than 4 on detail fetches. Without the second, one
        # company can consume the run on its own - Bosch carries 4,803
        # postings and ran past ten minutes unbounded. Worst case is now
        # 25 + 4 minutes against the 45 this step allows.
        run: |
          python ingestion/board_ingest.py --max-seconds 1200 --board-seconds 240

      # Newly seen employers become candidates for their own board. Capped so
      # the daily run stays bounded; failures are cached, so each day works
      # through companies the previous days have not already answered.
      - name: Discover new boards
        timeout-minutes: 20
        continue-on-error: true
        run: python ingestion/board_discovery.py --load-manual --top 60

      # Before loading, not after. The warehouse sits on a 512 MB ceiling and
      # description text is most of what fills it - 240 MB of 489 used. Once
      # it is full the load fails outright ("could not extend file because
      # project size limit has been exceeded") and takes the seven steps after
      # it down as skipped, which is how the pipeline broke on 7 September.
      #
      # Descriptions are working storage, not a record: nothing displays them,
      # only extraction and scoring read them, and S3 keeps the originals.
      # Pruning the oldest text back until the database is under target keeps
      # the load able to run every day rather than until the next ceiling.
      - name: Make room in the warehouse
        timeout-minutes: 15
        run: python storage/prune.py --apply --target-mb 380

      - name: Load aggregator postings to warehouse
        timeout-minutes: 20
        run: python storage/load_to_warehouse.py --country us ca

      - name: Load board postings to warehouse
        timeout-minutes: 20
        run: python storage/load_to_warehouse.py --boards

      - name: Extract technologies
        run: python ai_layer/extract_tech.py

      # dbt_utils has to be installed before anything dbt runs. The models
      # use generate_surrogate_key for the star schema and star() to carry
      # every column except the description through the marts, so without the
      # package dbt fails at parse time - instantly, with exit code 2, which
      # reads like a mystery rather than a missing dependency.
      #
      # CI has always run this; the daily pipeline never did. It went
      # unnoticed because the run had not reached the transform since the
      # secrets were added - every failure before today was at an earlier
      # step.
      # dbt's profiles.yml reads NEON_USER and NEON_PASSWORD, deliberately
      # without defaults so no password is committed. Locally those come from
      # .env, which dbt loads by itself - dbt/cli/main.py calls
      # load_dotenv(find_dotenv(usecwd=True)) on startup. CI has no .env,
      # because it is gitignored, so dbt failed at parse time with "Env var
      # required but not provided: 'NEON_USER'" and exited 2 instantly.
      #
      # That auto-loading is exactly why the failure resisted diagnosis: the
      # same command passes locally and fails in CI, and the error never left
      # the runner.
      #
      # Both are derived from DATABASE_URL rather than added as new secrets,
      # so there is one credential to rotate rather than three that can drift
      # apart.
      - name: Derive warehouse credentials for dbt
        run: |
          # Two destinations, and they are not interchangeable: ::add-mask::
          # is a workflow command and must go to STDOUT, while NAME=VALUE
          # pairs go to the $GITHUB_ENV file. Writing the mask command into
          # the env file fails the step with "Invalid format".
          CREDS=$(python - <<'PY'
          import os, urllib.parse as up
          raw = os.environ["DATABASE_URL"].strip().strip("'\"")
          p = up.urlparse(raw)
          user = up.unquote(p.username or "")
          pw = up.unquote(p.password or "")
          if not user or not pw:
              raise SystemExit("DATABASE_URL carries no user or password")
          print(user)
          print(pw)
          PY
          )
          NEON_USER=$(printf '%s\n' "$CREDS" | sed -n 1p)
          NEON_PASSWORD=$(printf '%s\n' "$CREDS" | sed -n 2p)
          echo "::add-mask::$NEON_PASSWORD"
          echo "NEON_USER=$NEON_USER" >> "$GITHUB_ENV"
          echo "NEON_PASSWORD=$NEON_PASSWORD" >> "$GITHUB_ENV"
          echo "derived credentials for user $NEON_USER"

      - name: Install dbt packages
        timeout-minutes: 5
        working-directory: dbt_signal
        run: dbt deps

      # dbt's own error goes into the step summary, which is public, because
      # step LOGS need admin rights on this repo and step names alone cannot
      # distinguish a missing dependency from a failing test from a bad
      # credential - all three exit 2 instantly. Three separate diagnoses of
      # this step were guesses for exactly that reason.
      # dbt's error is emitted as a workflow ANNOTATION, not just a step
      # summary. Step logs need admin rights on this repository and summaries
      # are only rendered in the web UI, but annotations are readable through
      # the public API - so this is the one channel that can actually be read
      # back when the run fails. Three separate diagnoses of this step were
      # guesses precisely because "exit code 2" was all that escaped.
      - name: Transform
        timeout-minutes: 40
        working-directory: dbt_signal
        run: |
          set -o pipefail
          if ! dbt build --profiles-dir . --no-version-check --target prod 2>&1 | tee /tmp/dbt.log; then
            {
              echo "### dbt build failed"
              echo '```'
              tail -60 /tmp/dbt.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Annotations cannot contain raw newlines; %0A is the escape.
            DETAIL=$(grep -iE "error|fail|not found|env var|compil|database|permission|does not exist" /tmp/dbt.log \
                     | head -12 | sed 's/"/\x27/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=dbt build failed::${DETAIL:-no matching lines; last line was $(tail -1 /tmp/dbt.log)}"
            exit 1
          fi

      # Capped: the only step that spends money. The enricher also skips any
      # posting whose text has not changed.
      - name: Score new roles
        # github.event.inputs rather than inputs: on a scheduled run the
        # inputs context is empty, and comparing explicitly to 'true' is
        # unambiguous where negating an absent value is not.
        if: ${{ github.event.inputs.skip_enrichment != 'true' }}
        timeout-minutes: 40
        continue-on-error: true          # a scoring failure must not block the refresh
        # Two passes, because the two halves of the board are worth different
        # amounts. Intern and entry roles are the ones actually applied to, and
        # their hard call - visa eligibility on a posting that never states its
        # position - is where Opus earns its price. Everything else is
        # structured classification, which Haiku does at a quarter the cost
        # ($0.0042 a role against $0.0163, both measured).
        #
        # --linkable and --relevant keep the spend on roles the site can
        # actually publish. Without them the run pays for aggregator postings
        # that are never shown, and for "entry" titles like Consumer Sales
        # Associate that a data profile will never match.
        #
        # The limits are a daily cost ceiling, not a target: roughly $0.80 for
        # the first pass and $1.70 for the second, and they only bind on a day
        # with that much genuinely new work. Scoring is incremental, so a
        # posting is charged for once unless its description changes.
        run: |
          PYTHONPATH=ai_layer python ai_layer/enrich.py \
            --seniority intern entry --linkable --relevant --limit 50
          PYTHONPATH=ai_layer python ai_layer/enrich.py \
            --model claude-haiku-4-5-20251001 --linkable --relevant --limit 400

      - name: Refresh marts
        working-directory: dbt_signal
        run: dbt build --profiles-dir . --no-version-check --target prod --select marts.*+

      # Gates the run. No retry: a failing check is a real problem, and
      # retrying only delays learning about it.
      - name: Data quality checks
        run: python quality/expectations.py

      - name: Export curated Parquet
        run: python storage/export_parquet.py

      - name: Summarise the run
        if: always()
        run: |
          {
            echo "## Daily pipeline"
            python -c "
          import sys; sys.path.insert(0, 'storage')
          from db import connect
          c = connect(autocommit=True); cur = c.cursor()
          for label, q in [('postings','select count(*) from raw_postings'),
                           ('companies','select count(*) from dim_company'),
                           ('scored','select count(*) from job_enrichment'),
                           ('snapshot days','select count(distinct snapshot_date) from market_snapshots')]:
              cur.execute(q); print(f'| {label} | {cur.fetchone()[0]:,} |')
          " 2>/dev/null | sed '1i | metric | value |\n| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"

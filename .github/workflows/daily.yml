name: Daily pipeline

# The scheduled production run. Unlike CI this needs real credentials, so it is
# split into its own workflow: pull request checks stay runnable by anyone,
# and only this one depends on secrets.
#
# Required repository secrets:
#   ANTHROPIC_API_KEY, ADZUNA_APP_ID, ADZUNA_API_KEY,
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET,
#   DATABASE_URL   (the Neon connection string)
on:
  schedule:
    - cron: "0 7 * * *"        # 07:00 UTC
  workflow_dispatch:
    inputs:
      skip_enrichment:
        description: "Skip the LLM scoring step (saves cost)"
        type: boolean
        default: false

concurrency:
  group: daily-pipeline        # runs share warehouse tables
  cancel-in-progress: false

jobs:
  pipeline:
    name: Capture, load, transform, score, validate
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DO_NOT_TRACK: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-dev.txt

      # The compounding asset. Runs first and independently: a missed snapshot
      # cannot be backfilled, because the source API only reports today.
      - name: Market snapshot
        run: python ingestion/market_snapshot.py

      - name: Ingest postings
        run: python ingestion/adzuna_ingest.py --pages 5 --country us ca --resume

      - name: Load to warehouse
        run: python storage/load_to_warehouse.py --country us ca

      - name: Extract technologies
        run: python ai_layer/extract_tech.py

      - name: Transform
        working-directory: dbt_signal
        run: dbt build --profiles-dir . --no-version-check --target prod

      # Capped: the only step that spends money.
      - name: Score new roles
        if: ${{ !inputs.skip_enrichment }}
        run: PYTHONPATH=ai_layer python ai_layer/enrich.py --seniority intern entry --limit 150

      - name: Refresh marts
        if: ${{ !inputs.skip_enrichment }}
        working-directory: dbt_signal
        run: dbt build --profiles-dir . --no-version-check --target prod --select marts.*+

      # Gates the run. No retry: a failing check is a real problem and the
      # point is to be told, not to paper over it.
      - name: Data quality checks
        run: python quality/expectations.py

      - name: Export curated Parquet
        run: python storage/export_parquet.py

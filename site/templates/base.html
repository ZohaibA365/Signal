<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<meta name="description" content="{{ page_description }}">
<link rel="canonical" href="{{ site_url }}{{ canonical }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_description }}">
<meta property="og:url" content="{{ site_url }}{{ canonical }}">
<meta property="og:site_name" content="Signal">
<meta name="twitter:card" content="summary">
<link rel="icon" href="{{ rel }}favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ rel }}style.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="{{ rel }}">
      <svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="4"  y="19" width="5" height="9"  rx="1" fill="currentColor" opacity=".45"/>
        <rect x="13" y="12" width="5" height="16" rx="1" fill="currentColor" opacity=".7"/>
        <rect x="22" y="4"  width="5" height="24" rx="1" fill="currentColor"/>
      </svg>
      Signal
    </a>
    <nav>
      <a href="{{ rel }}"{% if nav == 'jobs' %} aria-current="page"{% endif %}>Jobs</a>
      <a href="{{ rel }}companies/"{% if nav == 'companies' %} aria-current="page"{% endif %}>Companies</a>
      <a href="{{ rel }}market/"{% if nav == 'market' %} aria-current="page"{% endif %}>Market</a>
      <a href="{{ rel }}method/"{% if nav == 'method' %} aria-current="page"{% endif %}>Method</a>
    </nav>
  </div>
</header>

{% block body %}{% endblock %}

<footer>
  <div class="wrap">
    <span>{{ stats.postings | fmt }} postings · {{ stats.companies | fmt }} employers ·
      {{ stats.total_filings | fmt }} visa filings</span>
    <span class="num">Updated {{ generated_at }} · <a href="{{ repo_url }}">source</a></span>
  </div>
</footer>
</body>
</html>

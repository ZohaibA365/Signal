# Lint config. Deliberately narrow: the point is catching real defects
# (undefined names, unused imports, shadowed builtins), not enforcing a style
# opinion across a codebase written to be read.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long lines are usually explanatory comments here
    "B008",   # function call in default arg - argparse patterns rely on it
]

[lint.per-file-ignores]
# The DAG assigns tasks to names that are then only referenced in the
# dependency graph, which reads as unused to a linter.
"orchestration/signal_dag.py" = ["F841"]
